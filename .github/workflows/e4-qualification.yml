name: E4 candidate qualification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  qualify:
    if: >-
      github.repository == 'zlareb1/enterprise-ai-engineering-handbook' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'qualify/e4-build-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify source and candidate pins
        id: pins
        run: python .github/qualification/check_e4.py source
      - name: Install unchanged venue dependencies
        id: deps
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip freeze
          python --version
          mkdocs --version
      - name: Check new links
        id: links
        if: ${{ !cancelled() && steps.pins.outcome == 'success' }}
        run: python .github/qualification/check_e4.py links
      - name: Build full candidate with strict gate
        id: candidate
        if: ${{ !cancelled() && steps.pins.outcome == 'success' && steps.deps.outcome == 'success' }}
        run: mkdocs build --strict
      - name: Check rendered changed page and navigation
        id: rendered
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        run: python .github/qualification/check_e4.py rendered
      - name: Build repaired baseline without E4 prose with same strict gate
        id: baseline
        if: ${{ !cancelled() && steps.pins.outcome == 'success' && steps.deps.outcome == 'success' }}
        run: |
          git diff a49ff9d84c592ed8f20c6edb0d833939b958749d HEAD -- mkdocs.yaml > "$RUNNER_TEMP/e4-source-repair.patch"
          git worktree add --detach "$RUNNER_TEMP/e4-repaired-baseline" a49ff9d84c592ed8f20c6edb0d833939b958749d
          cd "$RUNNER_TEMP/e4-repaired-baseline"
          git apply "$RUNNER_TEMP/e4-source-repair.patch"
          sha256sum mkdocs.yaml
          mkdocs build --strict
      - name: Record qualification outcomes
        if: ${{ always() }}
        env:
          PIN_OUTCOME: ${{ steps.pins.outcome }}
          DEPENDENCY_OUTCOME: ${{ steps.deps.outcome }}
          LINK_OUTCOME: ${{ steps.links.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          RENDERED_OUTCOME: ${{ steps.rendered.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          report = {k: os.environ[k] for k in ('PIN_OUTCOME', 'DEPENDENCY_OUTCOME', 'LINK_OUTCOME', 'CANDIDATE_OUTCOME', 'RENDERED_OUTCOME', 'BASELINE_OUTCOME')}
          print(json.dumps(report, indent=2))
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as output:
              output.write('```json\n' + json.dumps(report, indent=2) + '\n```\n')
          PYTHON
